name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMAGE=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [ "$REF_TYPE" = tag ]; then
            TAG="$REF_NAME"
          else
            TAG=latest
          fi
          docker build --build-arg BUILD_VERSION="$GITHUB_SHA" -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
      - name: Publish runtime update
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Upload runtime update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build
          tar -czf runtime.tar.gz agent/dist frontend/dist
          VERSION="$GITHUB_SHA" LOCK_HASH=$(sha256sum package-lock.json | cut -d' ' -f1) ARCHIVE_HASH=$(sha256sum runtime.tar.gz | cut -d' ' -f1) node -e 'const fs = require("node:fs"); fs.writeFileSync("runtime.json", JSON.stringify({version: process.env.VERSION, lockHash: process.env.LOCK_HASH, sha256: process.env.ARCHIVE_HASH}) + "\n")'
          gh release view runtime-latest >/dev/null 2>&1 || gh release create runtime-latest --target "$GITHUB_SHA" --title 'Runtime update' --notes 'Latest main build' --latest=false
          gh release upload runtime-latest runtime.tar.gz runtime.json --clobber
