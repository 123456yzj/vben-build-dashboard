services:
  agent:
    image: ghcr.io/123456yzj/vben-build-dashboard:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-9527}:9527"
    environment:
      HOST: 0.0.0.0
      PORT: 9527
      PROJECTS_FILE: /app/config/projects.json
      HISTORY_FILE: /app/data/build-history.json
    volumes:
      - ../config/projects.json:/app/config/projects.json:ro
      - ../data:/app/data
      - ${PROJECTS_ROOT:-/data/projects}:${PROJECTS_ROOT:-/data/projects}
