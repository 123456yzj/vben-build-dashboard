services:
  agent:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-9527}:9527"
    environment:
      HOST: 0.0.0.0
      PORT: 9527
      PROJECTS_FILE: /app/config/projects.json
      HISTORY_FILE: /app/data/build-history.json
    volumes:
      - ./config/projects.json:/app/config/projects.json:ro
      - ./data:/app/data
      # All configured project paths must exist inside the container at the same absolute path.
      - ${PROJECTS_ROOT:-/data/projects}:${PROJECTS_ROOT:-/data/projects}
