services:
  agent:
    image: ghcr.io/123456yzj/vben-build-dashboard:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-9527}:9527"
    environment:
      HOST: 0.0.0.0
      PORT: 9527
      WORKSPACES_FILE: /app/config/workspaces.json
      HISTORY_FILE: /app/data/build-tasks.json
    volumes:
      - ./config/workspaces.json:/app/config/workspaces.json:ro
      - ./data:/app/data
      # Workspace paths must exist inside the container at the same absolute path.
      - ${PROJECTS_ROOT:-/data/projects}:${PROJECTS_ROOT:-/data/projects}
